name: Build Garmin Watchface (.iq)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Garmin Connect IQ SDK & Build
        run: |
          mkdir -p ciq-sdk
          curl -L -o sdk.zip "https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-6.4.2-2024-01-10-58473c9b7.zip"
          unzip -q sdk.zip -d ciq-sdk
          
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key.pem -out developer_key.der -nocrypt
          
          ./ciq-sdk/bin/monkeyc -e -o release.iq -f monkey.jungle -y developer_key.der -d instinct2solar

      - name: Upload .iq Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Garmin-IQ-Package
          path: release.iq


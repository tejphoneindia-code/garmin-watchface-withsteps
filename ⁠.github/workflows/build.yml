name: Build Garmin Watchface (.iq)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Garmin Connect IQ SDK & Build Package
        run: |
          mkdir -p ciq-sdk
          curl -L -o sdk.zip https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-4.1.7-2022-11-21-5a3311090.zip
          unzip -q sdk.zip -d ciq-sdk
          
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key.pem -out developer_key.der -nocrypt

          ./ciq-sdk/bin/monkeyc -e -o release.iq -m manifest.xml -f monkey.jungle -y developer_key.der

      - name: Upload .iq Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Garmin-IQ-Package
          path: release.iq
          
